# Groundup / N/S/E/W standard values.
# Sidebar toggle: NSEW.
pixel_size_nm: 3500.0
preprocessing:
  denoise: true
  denoise_sigma: 1.5
  flatten_illumination: true
  flatten_sigma: 160.0
  contrast_stretch: true
  contrast_percentiles:
  - 1.0
  - 99.0
detection:
  method: fft
  fft_peak_threshold: 0.35
  blob_threshold: 0.3
  min_prominence: 0.45
  min_confidence: 0.5
  blob_min_sigma: 2.5
  blob_max_sigma: 36.0
  local_snr_sigma: 66.0
  edge_exclude_px: 12.0
  min_circularity: 0.0
  structure_neighbor_px: 33.0
  tophat_radius: 50
ml:
  enabled: false
  model_path: models/particle_clf_v5.joblib
  threshold: 0.39
