input_dir: ""
output_dir: ""
filename_pattern: '\((?P<row>\d+),(?P<col>\d+)\)\.(?:tiff?|bmp|png|jpe?g)'
overlap_fraction: 0.1
pixel_size_nm: 3610.0

pipeline:
  workers: 10

preprocessing:
  denoise: true
  denoise_sigma: 1.0
  contrast_stretch: true
  contrast_percentiles: [1.0, 99.0]
  flatten_illumination: true
  flatten_sigma: 160.0

detection:
  method: fft
  particles_bright: true
  fft_peak_threshold: 0.35
  fft_notch_radius: 3
  fft_mask: per_tile
  tophat_radius: 50
  min_size_nm: 20000.0
  max_size_nm: 100000.0
  size_mass_fraction: 0.4
  blob_min_sigma: 1.959
  blob_max_sigma: 9.794
  blob_sigma_ratio: 1.4
  blob_threshold: 0.12
  min_prominence: 0.30
  min_area_px: 4
  island_min_nm: 20000.0
  island_large_nm: 40000.0
  island_max_aspect: 3.0
  island_min_solidity: 0.35
  island_open_px: 4
  min_confidence: 0.50
  local_snr_sigma: 126.0
  edge_soften_sigma: 12.0
  edge_soften_strength: 2.0
  edge_exclude_px: 8.0
  edge_min_length_px: 40.0
  min_circularity: 0.0
  structure_neighbor_px: 48.0
  structure_min_neighbors: 3
  structure_size_ratio: 1.30
  structure_line_bin_px: 10.0
  structure_line_min_run: 3
  structure_line_min_span_px: 48.0
  structure_line_max_gap_px: 48.0

measurement:
  merge_radius_px: 8.0
  size_aggregation: max
  nsew_size_match_fraction: 0.4
  nsew_merge_radius_px: 24.0

ml:
  enabled: true
  score_before_structure: false

labeling:
  source_csv: recall/particles.csv

report:
  target_mb: 20.0
  f_beta: 1.0
  beta_presets:
    - beta: 0.5
      model_path: src/analyse/models/particle_clf_v7.joblib
      threshold: 0.6
    - beta: 1.0
      model_path: src/analyse/models/particle_clf_v8.joblib
      threshold: 0.31
    - beta: 1.5
      model_path: src/analyse/models/particle_clf_v8.joblib
      threshold: 0.31
    - beta: 2.0
      model_path: src/analyse/models/particle_clf_v7.joblib
      threshold: 0.21
